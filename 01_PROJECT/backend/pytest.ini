[pytest]
testpaths = tests
addopts = -q --tb=short -m "not slow and not live"
markers =
    slow: long-running (live inference, subprocess portability). Run with -m slow
    live: calls the real Gemini API — costs money, needs a key and network.
          Run with -m live (or: python tasks.py genai-check)
filterwarnings =
    ignore::DeprecationWarning
