# Serves the built SPA and proxies /api to the backend, so the browser only ever
# talks to one origin. That is why the frontend needs no CORS configuration and
# no hard-coded API host: VITE_API_BASE_URL stays unset and the client falls
# back to the same-origin path "/api/v1".
#
# IMPORTANT — envsubst safety
# ---------------------------
# The nginx image renders /etc/nginx/templates/*.template through envsubst at
# start-up. By default it substitutes EVERY defined environment variable, which
# would silently blank out nginx's own runtime variables ($host, $uri,
# $remote_addr, ...) if the container ever had a matching env var. The Dockerfile
# therefore sets NGINX_ENVSUBST_FILTER=API_HOST so that API_HOST is the only
# thing substituted here.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening. No CSP is set here because the app loads no third-party
    # resources; add one at the edge proxy if this is exposed publicly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed asset filenames, so they are immutable.
    # index.html must never be cached or a deploy will not be picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths must return the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API passthrough. API_HOST is substituted at container start.
    location /api/ {
        proxy_pass http://${API_HOST}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live model verification runs for ~45 s, so the default 60 s read
        # timeout is too tight to be safe.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
