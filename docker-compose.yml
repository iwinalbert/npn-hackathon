# Retail Demand Forecasting — full product stack
#
#   python tasks.py build-db      # ONCE, on the host — see below
#   docker compose up --build     # then: http://localhost:8080
#
# PREREQUISITE: 01_PROJECT/backend/data/ must contain product.duckdb,
# history.parquet and backtest.parquet before `up`. That directory is gitignored
# (130 MB, rebuildable) and is bind-mounted READ-ONLY into the API.
# If it is empty the API starts but /api/v1/ready reports not-ready, its
# healthcheck never passes, and the frontend — which waits for service_healthy —
# never starts. That looks like a hang; it is a missing data layer.
#
# Optional AI assistant: put GEMINI_API_KEY in a .env file beside this compose
# file, or export it in the shell. Compose substitutes it at run time; it is
# never written into an image layer.
#
# The browser talks only to the frontend container. nginx proxies /api to the
# API service on the internal network, so there is one origin, no CORS in play,
# and no API host baked into the JavaScript bundle.
#
# The research tree is mounted READ-ONLY (:ro) and both containers run as
# non-root, so the frozen model artefacts cannot be modified even by accident.

services:
  api:
    build:
      context: .
      dockerfile: 01_PROJECT/backend/Dockerfile
      target: full          # use `api` for a lean build without live inference
    image: npn-forecast-api:latest
    container_name: npn-api
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Published so /docs and the raw API can be reached directly. The frontend
    # does NOT use this: it proxies over the internal network to api:8000.
    # Remove this block to keep the API off the host entirely.
    ports:
      - "8000:8000"
    environment:
      NPN_ENVIRONMENT: production
      NPN_DATA_DIR: /data/product
      NPN_PROJECT_ROOT: /research
      # Same-origin through the nginx proxy means CORS is not exercised in this
      # topology. These entries only matter if a browser is pointed straight at
      # the API, e.g. during frontend development with `npm run dev`.
      NPN_CORS_ORIGINS: "http://localhost:5173,http://localhost:4173,http://localhost:8080"
      NPN_LOG_LEVEL: INFO
      NPN_ENABLE_INFERENCE: "true"
      # AI assistant. Injected at RUNTIME from the host environment or a .env
      # file next to this compose file — never baked into the image, never sent
      # to the browser. Leave unset to run without the assistant: every other
      # feature works and /genai/status explains why it is unavailable.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # product data layer (product.duckdb + the two parquet sidecars) — 130 MB
      - ./01_PROJECT/backend/data:/data/product:ro
      # frozen model artefacts, read-only — needed only for live inference
      - ./03_RESEARCH/models/champion:/research/models/champion:ro
      - ./03_RESEARCH/predictions/final_forecast:/research/predictions/final_forecast:ro
      # writable scratch: the research pipeline creates directories on import
      - npn-scratch:/research/experiments
      - npn-scratch-preds:/research/predictions/validation
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys,json;r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready',timeout=4));sys.exit(0 if r.get('ready') else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          # Idle ~200 MB; a live inference job peaks near 1 GB because it loads
          # the 59.2M-row panel to rebuild features.
          memory: 2G

  frontend:
    build:
      context: ./01_PROJECT/frontend
      dockerfile: Dockerfile
    image: npn-forecast-frontend:latest
    container_name: npn-frontend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8080:8080"
    environment:
      # Where nginx proxies /api/. Service name + internal port, not localhost.
      API_HOST: api:8000
    depends_on:
      api:
        # Wait for the API's data layer to be queryable, not merely for the
        # process to exist — otherwise the first page load races the DB open.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 4s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  npn-scratch:
  npn-scratch-preds:
