<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1240" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B3B3B"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ED7100"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DD344C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1240" fill="#FFFFFF"/>

  <!-- ============ ICON GLYPH DEFS (simple original pictograms, AWS family colors) ============ -->
  <defs>
    <g id="icon-ec2">
      <rect x="6" y="6" width="32" height="32" rx="4" fill="none" stroke="#fff" stroke-width="2.4"/>
      <rect x="14" y="14" width="16" height="16" rx="1.5" fill="#fff"/>
      <line x1="0" y1="12" x2="6" y2="12" stroke="#fff" stroke-width="2.2"/>
      <line x1="0" y1="20" x2="6" y2="20" stroke="#fff" stroke-width="2.2"/>
      <line x1="0" y1="28" x2="6" y2="28" stroke="#fff" stroke-width="2.2"/>
      <line x1="38" y1="12" x2="44" y2="12" stroke="#fff" stroke-width="2.2"/>
      <line x1="38" y1="20" x2="44" y2="20" stroke="#fff" stroke-width="2.2"/>
      <line x1="38" y1="28" x2="44" y2="28" stroke="#fff" stroke-width="2.2"/>
    </g>
    <g id="icon-ecr">
      <rect x="4" y="16" width="16" height="16" rx="2" fill="none" stroke="#fff" stroke-width="2.2"/>
      <rect x="14" y="10" width="16" height="16" rx="2" fill="none" stroke="#fff" stroke-width="2.2"/>
      <rect x="24" y="16" width="16" height="16" rx="2" fill="#fff"/>
    </g>
    <g id="icon-s3">
      <path d="M8,10 L36,10 L36,34 Q22,39 8,34 Z" fill="none" stroke="#fff" stroke-width="2.4"/>
      <path d="M8,10 Q22,15 36,10" fill="none" stroke="#fff" stroke-width="2.4"/>
      <path d="M8,20 Q22,25 36,20" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.7"/>
    </g>
    <g id="icon-iam">
      <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2.4"/>
      <circle cx="16" cy="16" r="3.4" fill="#fff"/>
      <line x1="22" y1="22" x2="38" y2="38" stroke="#fff" stroke-width="2.6"/>
      <line x1="30" y1="30" x2="34" y2="26" stroke="#fff" stroke-width="2.6"/>
      <line x1="34" y1="34" x2="38" y2="30" stroke="#fff" stroke-width="2.6"/>
    </g>
    <g id="icon-kms">
      <rect x="12" y="20" width="24" height="18" rx="3" fill="none" stroke="#fff" stroke-width="2.4"/>
      <path d="M17,20 L17,13 A7,7 0 0 1 31,13 L31,20" fill="none" stroke="#fff" stroke-width="2.4"/>
      <circle cx="24" cy="29" r="2.6" fill="#fff"/>
    </g>
    <g id="icon-ssm">
      <rect x="6" y="8" width="32" height="26" rx="3" fill="none" stroke="#fff" stroke-width="2.4"/>
      <line x1="12" y1="16" x2="26" y2="16" stroke="#fff" stroke-width="2.2"/>
      <line x1="12" y1="22" x2="30" y2="22" stroke="#fff" stroke-width="2.2"/>
      <line x1="12" y1="28" x2="22" y2="28" stroke="#fff" stroke-width="2.2"/>
      <path d="M18,40 L30,40 L24,34 Z" fill="#fff"/>
    </g>
    <g id="icon-cloudtrail">
      <ellipse cx="22" cy="22" rx="18" ry="11" fill="none" stroke="#fff" stroke-width="2.4"/>
      <circle cx="22" cy="22" r="5.4" fill="#fff"/>
    </g>
    <g id="icon-cloudwatch">
      <circle cx="22" cy="22" r="17" fill="none" stroke="#fff" stroke-width="2.2"/>
      <polyline points="10,26 16,16 22,28 28,14 34,22" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g id="icon-vpc">
      <rect x="6" y="6" width="32" height="32" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/>
      <circle cx="12" cy="12" r="2.6" fill="#fff"/>
      <circle cx="32" cy="12" r="2.6" fill="#fff"/>
      <circle cx="12" cy="32" r="2.6" fill="#fff"/>
      <circle cx="32" cy="32" r="2.6" fill="#fff"/>
      <line x1="12" y1="12" x2="32" y2="32" stroke="#fff" stroke-width="1.6"/>
      <line x1="32" y1="12" x2="12" y2="32" stroke="#fff" stroke-width="1.6"/>
    </g>
    <g id="icon-docker">
      <rect x="4" y="16" width="9" height="9" fill="#fff"/>
      <rect x="15" y="16" width="9" height="9" fill="#fff"/>
      <rect x="26" y="16" width="9" height="9" fill="#fff"/>
      <rect x="15" y="5" width="9" height="9" fill="#fff"/>
      <path d="M2,27 Q22,40 44,27 Q40,34 30,34 L14,34 Q4,34 2,27 Z" fill="#fff"/>
    </g>
  </defs>

  <!-- ============ title ============ -->
  <text x="24" y="34" font-size="22" font-weight="700" fill="#16191F">Retail Demand Forecasting — Cloud Deployment Architecture</text>
  <text x="24" y="56" font-size="12.5" fill="#5C6670">Push to GitHub main → GitHub Actions (OIDC) → AWS · EC2 running Docker Compose, no SSH, no stored credentials</text>

  <!-- ============ actor column ============ -->
  <rect x="10" y="330" width="150" height="340" fill="none" stroke="#232F3E" stroke-width="1.2" stroke-dasharray="3 3"/>

  <circle cx="85" cy="400" r="24" fill="none" stroke="#0972D3" stroke-width="2.2"/>
  <circle cx="85" cy="392" r="8" fill="none" stroke="#0972D3" stroke-width="2.6"/>
  <path d="M69,417 Q69,401 85,401 Q101,401 101,417" fill="none" stroke="#0972D3" stroke-width="2.6" stroke-linecap="round"/>
  <text x="85" y="448" font-size="12" text-anchor="middle" fill="#16191F" font-weight="600">Developer</text>
  <text x="85" y="463" font-size="9.5" text-anchor="middle" fill="#5C6670">git push main</text>

  <circle cx="85" cy="500" r="24" fill="none" stroke="#5C6670" stroke-width="2.2"/>
  <path d="M85,488 A12,12 0 1 1 73,500" fill="none" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M85,488 L91,484 M85,488 L91,492" fill="none" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="85" y="548" font-size="12" text-anchor="middle" fill="#16191F" font-weight="600">GitHub Actions</text>
  <text x="85" y="563" font-size="9.5" text-anchor="middle" fill="#5C6670">CI/CD runner</text>

  <circle cx="85" cy="600" r="24" fill="none" stroke="#0972D3" stroke-width="2.2"/>
  <circle cx="85" cy="592" r="8" fill="none" stroke="#0972D3" stroke-width="2.6"/>
  <path d="M69,617 Q69,601 85,601 Q101,601 101,617" fill="none" stroke="#0972D3" stroke-width="2.6" stroke-linecap="round"/>
  <text x="85" y="648" font-size="12" text-anchor="middle" fill="#16191F" font-weight="600">Judge / Public</text>
  <text x="85" y="663" font-size="9.5" text-anchor="middle" fill="#5C6670">browser, port 8080</text>

  <!-- internet gateway -->
  <circle cx="210" cy="500" r="26" fill="#F2F4F4" stroke="#8C4FFF" stroke-width="2.2"/>
  <use href="#icon-vpc" x="188" y="478" width="44" height="44" color="#8C4FFF"/>
  <text x="210" y="540" font-size="10.5" text-anchor="middle" fill="#16191F" font-weight="600">Internet</text>

  <line x1="160" y1="400" x2="196" y2="486" stroke="#232F3E" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="160" y1="500" x2="184" y2="500" stroke="#232F3E" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="160" y1="600" x2="196" y2="514" stroke="#232F3E" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- ============ VPC outer boundary ============ -->
  <rect x="264" y="70" width="1180" height="1140" fill="none" stroke="#248814" stroke-width="1.6"/>
  <rect x="264" y="70" width="26" height="26" fill="#248814"/>
  <path d="M270,90 a6,6 0 1 1 0.1,0 M275,86 a8,8 0 1 1 0.1,0" fill="none" stroke="#fff" stroke-width="1.4" transform="translate(0,-4) scale(0.9)"/>
  <text x="300" y="88" font-size="12" fill="#5C6670" font-weight="600">AWS Cloud &#160;·&#160; VPC (default) &#160;·&#160; us-east-1</text>

  <line x1="236" y1="500" x2="264" y2="500" stroke="#232F3E" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- ============ AWS-managed deploy resources zone ============ -->
  <rect x="284" y="106" width="880" height="900" fill="none" stroke="#0972D3" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="296" y="98" font-size="11.5" fill="#0972D3" font-weight="700">DEPLOY-TIME MANAGED RESOURCES</text>

  <!-- Identity Provider Module -->
  <rect x="312" y="140" width="270" height="120" rx="4" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="447" y="158" font-size="11.5" text-anchor="middle" font-weight="700" fill="#16191F">Identity Federation Module</text>
  <rect x="410" y="176" width="76" height="76" rx="10" fill="#DD344C"/>
  <use href="#icon-iam" x="426" y="192" width="44" height="44"/>
  <text x="447" y="270" font-size="11" text-anchor="middle" fill="#16191F">AWS IAM &#183; OIDC Provider</text>

  <path d="M109,492 C 170,450 230,240 312,204" fill="none" stroke="#5C6670" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="150" y="330" font-size="9.5" fill="#5C6670">OIDC: short-lived token</text>

  <!-- Deploy Role box, right of identity -->
  <rect x="612" y="140" width="270" height="120" rx="4" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="747" y="158" font-size="11.5" text-anchor="middle" font-weight="700" fill="#16191F">Registry Module</text>
  <rect x="710" y="176" width="76" height="76" rx="10" fill="#ED7100"/>
  <use href="#icon-ecr" x="728" y="196" width="40" height="40"/>
  <text x="747" y="270" font-size="11" text-anchor="middle" fill="#16191F">Amazon ECR &#183; npn-api / npn-frontend</text>

  <line x1="582" y1="196" x2="612" y2="196" stroke="#232F3E" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="597" y="188" font-size="8.6" text-anchor="middle" fill="#5C6670">assume role</text>
  <text x="597" y="216" font-size="8.6" text-anchor="middle" fill="#5C6670">publish</text>

  <path d="M486,220 C 700,220 850,250 890,290" fill="none" stroke="#DD344C" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="620" y="216" font-size="8.6" fill="#5C6670">assume role &#8594; deploy (SSM)</text>

  <!-- Security Group / EC2 zone (green tint) -->
  <rect x="312" y="300" width="820" height="440" fill="#EAF4EC" stroke="#248814" stroke-width="1.4"/>
  <rect x="322" y="292" width="18" height="18" fill="#248814"/>
  <text x="348" y="306" font-size="11.5" font-weight="700" fill="#16191F">Security Group &#183; inbound tcp/8080 ONLY &#183; port 22 closed</text>

  <rect x="880" y="290" width="248" height="26" rx="13" fill="#FCE9E9" stroke="#DD344C" stroke-width="1.2"/>
  <text x="1004" y="307" font-size="9" text-anchor="middle" fill="#DD344C" font-weight="600">reached only via SSM RunCommand</text>

  <!-- EC2 instance -->
  <rect x="336" y="334" width="248" height="150" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.6"/>
  <text x="460" y="354" font-size="11.5" text-anchor="middle" font-weight="700" fill="#16191F">Amazon EC2 &#183; t3.medium</text>
  <rect x="424" y="366" width="72" height="72" rx="10" fill="#ED7100"/>
  <use href="#icon-ec2" x="440" y="384" width="40" height="40"/>
  <text x="460" y="456" font-size="10" text-anchor="middle" fill="#5C6670">Elastic IP &#183; persists across stop/start</text>
  <text x="460" y="470" font-size="10" text-anchor="middle" fill="#5C6670">SSM Agent only, no SSH daemon exposed</text>

  <!-- Docker compose zone (blue tint, private-subnet analog) -->
  <rect x="612" y="330" width="500" height="290" fill="#EAF1FB" stroke="#0972D3" stroke-width="1.4"/>
  <rect x="622" y="322" width="18" height="18" fill="#0972D3"/>
  <text x="648" y="336" font-size="11.5" font-weight="700" fill="#16191F">Docker Compose &#183; the running stack</text>

  <rect x="632" y="356" width="216" height="120" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.3"/>
  <text x="740" y="374" font-size="11" text-anchor="middle" font-weight="700" fill="#16191F">frontend &#183; nginx</text>
  <rect x="704" y="384" width="72" height="72" rx="10" fill="#ED7100"/>
  <use href="#icon-docker" x="722" y="402" width="36" height="36"/>
  <text x="740" y="468" font-size="9.5" text-anchor="middle" fill="#5C6670">published :8080 &#183; read-only root</text>

  <line x1="848" y1="416" x2="892" y2="416" stroke="#232F3E" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="870" y="406" font-size="8.8" text-anchor="middle" fill="#5C6670">/api/</text>

  <rect x="896" y="356" width="196" height="120" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.3"/>
  <text x="994" y="374" font-size="11" text-anchor="middle" font-weight="700" fill="#16191F">api &#183; uvicorn</text>
  <rect x="958" y="384" width="72" height="72" rx="10" fill="#ED7100"/>
  <use href="#icon-docker" x="976" y="402" width="36" height="36"/>
  <text x="994" y="468" font-size="9.5" text-anchor="middle" fill="#5C6670">internal :8000, never published</text>

  <!-- data volume -->
  <rect x="632" y="500" width="460" height="100" rx="6" fill="#F1F6E6" stroke="#7AA116" stroke-width="1.6"/>
  <text x="862" y="518" font-size="11" text-anchor="middle" font-weight="700" fill="#16191F">/opt/npn/backend/data &#183; EBS volume, read-only</text>
  <text x="862" y="536" font-size="9.5" text-anchor="middle" fill="#5C6670">product.duckdb 20 MB &#183; history.parquet 32 MB &#183; backtest.parquet 78 MB</text>
  <rect x="800" y="546" width="52" height="52" rx="8" fill="#7AA116"/>
  <use href="#icon-s3" x="810" y="556" width="32" height="32"/>

  <line x1="740" y1="476" x2="740" y2="500" stroke="#232F3E" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="994" y1="476" x2="994" y2="500" stroke="#232F3E" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- ready gate note -->
  <rect x="336" y="640" width="776" height="70" rx="6" fill="#F2F4F4" stroke="#5C6670" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="356" y="666" font-size="11" font-weight="600" fill="#16191F">/api/v1/ready</text>
  <text x="356" y="684" font-size="9.5" fill="#5C6670">frontend does not route traffic until this reports the data layer is queryable — not just "process alive"</text>

  <!-- ============ Regional Services panel ============ -->
  <rect x="1184" y="106" width="360" height="900" fill="none" stroke="#8C8C8C" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="1364" y="98" font-size="11.5" text-anchor="middle" fill="#5C6670" font-weight="700">SUPPORTING AWS SERVICES</text>

  <!-- grid of 4 x 2 icon tiles -->
  <!-- row helper coordinates -->
  <g font-size="11" text-anchor="middle" fill="#16191F">
    <!-- tile 1 -->
    <rect x="1210" y="140" width="76" height="76" rx="10" fill="#DD344C"/>
    <use href="#icon-iam" x="1225" y="156" width="44" height="44"/>
    <text x="1248" y="234">AWS IAM</text>

    <!-- tile 2 -->
    <rect x="1310" y="140" width="76" height="76" rx="10" fill="#DD344C"/>
    <use href="#icon-kms" x="1326" y="156" width="44" height="44"/>
    <text x="1348" y="234">AWS KMS</text>

    <!-- tile 3 -->
    <rect x="1410" y="140" width="76" height="76" rx="10" fill="#E7157B"/>
    <use href="#icon-ssm" x="1426" y="156" width="44" height="44"/>
    <text x="1448" y="234">Systems</text>
    <text x="1448" y="248">Manager</text>

    <!-- tile 4 -->
    <rect x="1210" y="290" width="76" height="76" rx="10" fill="#ED7100"/>
    <use href="#icon-ecr" x="1226" y="308" width="44" height="44"/>
    <text x="1248" y="384">Amazon ECR</text>

    <!-- tile 5 -->
    <rect x="1310" y="290" width="76" height="76" rx="10" fill="#7AA116"/>
    <use href="#icon-s3" x="1326" y="306" width="44" height="44"/>
    <text x="1348" y="384">Amazon S3</text>

    <!-- tile 6 -->
    <rect x="1410" y="290" width="76" height="76" rx="10" fill="#ED7100"/>
    <use href="#icon-ec2" x="1424" y="306" width="44" height="44"/>
    <text x="1448" y="384">Amazon EC2</text>

    <!-- tile 7 -->
    <rect x="1210" y="440" width="76" height="76" rx="10" fill="#E7157B"/>
    <use href="#icon-cloudtrail" x="1226" y="456" width="44" height="44"/>
    <text x="1248" y="534">CloudTrail</text>

    <!-- tile 8 -->
    <rect x="1310" y="440" width="76" height="76" rx="10" fill="#E7157B"/>
    <use href="#icon-cloudwatch" x="1326" y="456" width="44" height="44"/>
    <text x="1348" y="534">CloudWatch</text>

    <!-- tile 9 -->
    <rect x="1410" y="440" width="76" height="76" rx="10" fill="#8C4FFF"/>
    <use href="#icon-vpc" x="1426" y="456" width="44" height="44"/>
    <text x="1448" y="534">VPC / SG</text>
  </g>

  <text x="1210" y="600" font-size="10.5" fill="#5C6670" font-weight="700">WHY EACH ONE IS HERE</text>
  <line x1="1210" y1="610" x2="1544" y2="610" stroke="#DADFE3" stroke-width="1"/>
  <text x="1210" y="632" font-size="9.5" fill="#16191F">IAM / KMS &#8212; OIDC trust + SecureString encryption</text>
  <text x="1210" y="652" font-size="9.5" fill="#16191F">Systems Manager &#8212; command channel; port 22 stays closed</text>
  <text x="1210" y="672" font-size="9.5" fill="#16191F">ECR &#8212; image registry, tagged by commit sha</text>
  <text x="1210" y="692" font-size="9.5" fill="#16191F">S3 &#8212; one-time data sync, not a runtime dependency</text>
  <text x="1210" y="712" font-size="9.5" fill="#16191F">CloudTrail / CloudWatch &#8212; every API call &amp; log, auditable</text>
  <text x="1210" y="732" font-size="9.5" fill="#16191F">EC2 &#8212; the one always-on compute instance</text>

  <!-- ============ external / customer-managed zone (outside AWS) ============ -->
  <rect x="24" y="1030" width="900" height="170" fill="none" stroke="#5C6670" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="40" y="1022" font-size="11.5" fill="#5C6670" font-weight="700">EXTERNAL &#183; NOT AWS-MANAGED</text>

  <rect x="56" y="1058" width="360" height="110" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.3"/>
  <text x="236" y="1078" font-size="11.5" text-anchor="middle" font-weight="700" fill="#16191F">GitHub &#183; source of truth</text>
  <circle cx="120" cy="1120" r="28" fill="none" stroke="#5C6670" stroke-width="2.2"/>
  <path d="M120,1106 A14,14 0 1 1 106,1120" fill="none" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M120,1106 L127,1101 M120,1106 L127,1111" fill="none" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="236" y="1108" font-size="10" text-anchor="middle" fill="#5C6670">main branch, protected</text>
  <text x="236" y="1126" font-size="10" text-anchor="middle" fill="#5C6670">Actions workflow: ci.yml</text>
  <text x="236" y="1144" font-size="10" text-anchor="middle" fill="#5C6670">no AWS key stored here, ever</text>

  <rect x="460" y="1058" width="440" height="110" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.3"/>
  <text x="680" y="1078" font-size="11.5" text-anchor="middle" font-weight="700" fill="#16191F">What never leaves this box</text>
  <text x="480" y="1102" font-size="9.8" fill="#5C6670">&#8226; long-lived AWS access keys</text>
  <text x="480" y="1120" font-size="9.8" fill="#5C6670">&#8226; the Gemini API key (fetched at deploy time, not stored here)</text>
  <text x="480" y="1138" font-size="9.8" fill="#5C6670">&#8226; any SSH private key &#8212; none exists for this box</text>
  <text x="480" y="1156" font-size="9.8" fill="#5C6670">&#8226; the 130 MB data layer &#8212; synced once, outside the deploy path</text>

  <!-- ============ footer ============ -->
  <line x1="24" y1="1216" x2="1544" y2="1216" stroke="#DADFE3" stroke-width="1"/>
  <text x="24" y="1232" font-size="10" fill="#5C6670">Every deploy re-checks the frozen forecast canary (total_28d = 3331.3681) against the live public IP before it's called successful.</text>
</svg>
