services:
  api:
    image: ${ECR_REGISTRY}/npn-api:${IMAGE_TAG:-latest}
    container_name: npn-api
    restart: always
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    expose:
      - "8000"
    environment:
      NPN_ENVIRONMENT: production
      NPN_DATA_DIR: /data/product
      NPN_LOG_LEVEL: INFO
      NPN_CORS_ORIGINS: ""
      NPN_CORS_ALLOW_ALL: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - /opt/npn/backend/data:/data/product:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys,json;r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready',timeout=4));sys.exit(0 if r.get('ready') else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  frontend:
    image: ${ECR_REGISTRY}/npn-frontend:${IMAGE_TAG:-latest}
    container_name: npn-frontend
    restart: always
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    environment:
      API_HOST: api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 4s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
